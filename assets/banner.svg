<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .glow-orb1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .glow-orb2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .pulse-pill {
        animation: pulsePill 4s ease-in-out infinite alternate;
      }
      .float-card {
        animation: floatCard 6s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 6 6;
        animation: flowDash 20s linear infinite;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -20px) scale(1.2); }
      }
      @keyframes pulsePill {
        0% { opacity: 0.85; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes floatCard {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -200; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <circle class="glow-orb1" cx="220" cy="120" r="180" fill="url(#glowGrad1)" />
  <circle class="glow-orb2" cx="980" cy="280" r="220" fill="url(#glowGrad2)" />

  <!-- Animated Connection / Circuit Lines (background elements) -->
  <path class="dash-flow" d="M 100 350 C 300 380, 500 320, 700 360 C 900 400, 1050 330, 1150 360" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="2" />
  <path class="dash-flow" d="M 50 80 C 250 40, 450 110, 750 60 C 950 20, 1080 90, 1180 70" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" />

  <!-- Foreground Title and Branding Elements -->
  <!-- Category Pill Badge -->
  <g class="pulse-pill" transform="translate(420, 48)">
    <rect width="360" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="20" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" letter-spacing="0.5">
      CURATED AI SALES &amp; EMAIL TECH STACK
    </text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-1">
    Awesome AI Email Copywriting
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
    Production-Grade SaaS Platforms • Open-Source Cold Outreach Agents • Deliverability &amp; Coaching
  </text>

  <!-- Dynamic Feature Showcase Pills / Cards (Foreground Bottom Row) -->
  <g class="float-card" transform="translate(90, 245)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect width="235" height="105" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#38bdf8" fill-opacity="0.15" />
      <text x="36" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#38bdf8">⚡</text>
      <text x="66" y="36" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Cold Outreach</text>
      <text x="66" y="52" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">AIDA • PAS • First-Lines</text>
      <text x="18" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">Automated lead prospecting &amp; tailored intro icebreakers.</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(260, 0)">
      <rect width="235" height="105" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#818cf8" fill-opacity="0.15" />
      <text x="36" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#818cf8">🎯</text>
      <text x="66" y="36" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Real-Time Coaching</text>
      <text x="66" y="52" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">Scoring • Personalization</text>
      <text x="18" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">Interactive inbox optimization for Gmail &amp; Outlook.</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(520, 0)">
      <rect width="235" height="105" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#c084fc" fill-opacity="0.15" />
      <text x="36" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#c084fc">🤖</text>
      <text x="66" y="36" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Autonomous Agents</text>
      <text x="66" y="52" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">LLM Sequences • SMTP</text>
      <text x="18" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">Self-hosted pipelines with follow-up sequences &amp; RAG.</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(780, 0)">
      <rect width="235" height="105" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#34d399" fill-opacity="0.15" />
      <text x="36" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#34d399">🛡️</text>
      <text x="66" y="36" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Inbox Deliverability</text>
      <text x="66" y="52" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">Spam Guards • DNS/SPF</text>
      <text x="18" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">Deliverability safeguards, warming &amp; triage hygiene.</text>
    </g>
  </g>

  <!-- Border Accent Line at Bottom -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
